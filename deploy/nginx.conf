# Build My AI — production reverse proxy (nginx equivalent of deploy/Caddyfile).
# Same-origin: static frontend + /v1/* proxied to the loopback-bound API, TLS here.
# Obtain the certificate with certbot (certbot --nginx -d buildmyai.example.com) or
# point ssl_certificate at your files. Replace buildmyai.example.com and the paths.
# Full runbook: deploy/README.md.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name buildmyai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buildmyai.example.com;

    ssl_certificate     /etc/letsencrypt/live/buildmyai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildmyai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/buildmyai/frontend;
    index index.html;

    # --- security headers (docs/19: CSP + transport hardening) ---
    # See deploy/Caddyfile for why connect-src includes http://127.0.0.1:* (the
    # local-model connector) alongside 'self' (the same-origin /v1/* API).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # --- API: forward to the loopback-bound backend ---
    location /v1/ {
        proxy_pass http://127.0.0.1:8940;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- static site ---
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
