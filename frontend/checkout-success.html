<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Your Build My AI subscription is being confirmed.">
<title data-en="Subscription confirmed — Build My AI" data-zh="订阅已确认 — Build My AI">Subscription confirmed — Build My AI</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/signup.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/fx.css">
</head>
<body>

<header class="topbar"><div class="wrap"><div class="row">
  <a class="brand" href="index.html"><span class="logo">◆</span> Build My AI</a>
  <div class="rt">
    <div class="langsw">
      <button class="langbtn active" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="langbtn" data-lang="zh" onclick="setLang('zh')">中</button>
    </div>
    <a class="btn ghost" href="dashboard.html" data-en="Control Center" data-zh="控制中心">Control Center</a>
  </div>
</div></div></header>

<div class="signup-wrap">
  <div class="signup-card fx-reveal">
    <div class="success">
      <div class="ic">✓</div>
      <div class="eyebrow" data-en="CHECKOUT COMPLETE" data-zh="结账完成">CHECKOUT COMPLETE</div>
      <h1 data-en="Thanks for subscribing" data-zh="感谢订阅">Thanks for subscribing</h1>
      <p id="checkoutPoll" data-en="Confirming your subscription…" data-zh="正在确认你的订阅…">Confirming your subscription…</p>
      <div id="checkoutDone" class="hidden">
        <a class="btn primary lg fx-btn-sweep" href="dashboard.html" data-en="Go to your Control Center →" data-zh="前往控制中心 →">Go to your Control Center →</a>
      </div>
    </div>
    <div class="alt-link"><span class="mono" data-en="Demo · payments are handled by Stripe's hosted checkout — no card details ever reach Build My AI. Your plan is applied server-side and shown here once confirmed." data-zh="演示 · 支付由 Stripe 托管结账处理——卡号信息绝不进入 Build My AI。套餐在服务端生效,确认后在此显示。">Demo · payments are handled by Stripe's hosted checkout — no card details ever reach Build My AI. Your plan is applied server-side and shown here once confirmed.</span></div>
  </div>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/local-llm.js"></script>
<script src="assets/checkout.js"></script>
<script src="assets/fx.js" defer></script>
</body>
</html>
