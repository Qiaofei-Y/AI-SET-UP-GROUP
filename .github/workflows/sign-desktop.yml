name: sign-desktop

# Pre-staged Azure Trusted Signing skeleton (see installer/code-signing.md).
# NOT active yet and NOT a PR gate: it runs only on manual dispatch, and no-ops
# (green) with instructions until BOTH (a) the Trusted Signing repo Variables are
# set and (b) a desktop build produces dist/*.msi. It never runs on push/PR, so it
# can't turn normal checks red before signing is wired.
on:
  workflow_dispatch:

# OIDC federation to Azure — no long-lived client secret is ever stored.
permissions:
  contents: read
  id-token: write

concurrency:
  group: sign-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    name: Sign Windows installer (Azure Trusted Signing)
    runs-on: windows-latest
    steps:
      # Guard: are the (non-secret) Trusted Signing Variables configured? If not,
      # print exactly what's missing and skip the rest — a green no-op, never a
      # fake "signed". Values come in via env so nothing is interpolated into the
      # shell (no script injection from a Variable value).
      - name: Preflight — is Trusted Signing configured yet?
        id: preflight
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          for v in AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE \
                   AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [ -n "${!v}" ] || missing+=("vars.$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Trusted Signing not configured yet — missing ${missing[*]}. See installer/code-signing.md. Skipping (no-op)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4

      # There is nothing to sign until the desktop build (Rust/Tauri) publishes
      # dist/*.msi. Fail loudly if triggered before that job is wired — honest,
      # not a silent green.
      - name: Locate installer artifact (dist/*.msi)
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          if ! ls dist/*.msi >/dev/null 2>&1; then
            echo "::error::No dist/*.msi found. Wire the desktop-build job to produce it first (see installer/code-signing.md)."
            exit 1
          fi

      - name: Azure login (OIDC, no secret)
        if: steps.preflight.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pin @v0 → a specific commit SHA before activating (supply-chain hygiene,
      # same discipline as the runtime digest pin in installer/runtime.json).
      - name: Sign with Azure Trusted Signing
        if: steps.preflight.outputs.configured == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: msi,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
